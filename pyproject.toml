[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mailsieve"
version = "2026.8.0"
description = "Self-hosted email validation API over the mailboxlayer verification endpoint"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
authors = [{ name = "Tomer" }]
keywords = ["email", "validation", "mailboxlayer", "fastapi", "self-hosted"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Framework :: FastAPI",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Communications :: Email",
]

dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "pyyaml>=6.0",
    "loguru>=0.7",
    "sqlalchemy[asyncio]>=2.0.36",
    "alembic>=1.14",
    "aiosqlite>=0.20",
    "redis>=5.2",
    "httpx>=0.28",
    "beautifulsoup4>=4.12",
    "lxml>=5.3",
    "email-validator>=2.2",
    "bcrypt>=4.2",
    "python-multipart>=0.0.12",
    "jinja2>=3.1",
]

[project.optional-dependencies]
postgres = ["asyncpg>=0.30"]
mysql = ["aiomysql>=0.2", "cryptography>=43"]
all = ["asyncpg>=0.30", "aiomysql>=0.2", "cryptography>=43"]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "pytest-cov>=6.0",
    "respx>=0.21",
    "ruff>=0.8",
    "mypy>=1.13",
    "types-pyyaml",
    "types-beautifulsoup4",
]

[project.urls]
Homepage = "https://github.com/t0mer/mailsieve"
Issues = "https://github.com/t0mer/mailsieve/issues"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.setuptools.package-data]
app = ["data/*.txt", "static/**/*"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "C4", "SIM", "ASYNC", "S"]
ignore = ["S101"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S105", "S106"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_unreachable = true
plugins = ["pydantic.mypy"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-q --strict-markers --cov=app --cov-report=term-missing"
markers = [
    "integration: requires a live database backend",
]
